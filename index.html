<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>静湖微澜 · Serene Ripple Lake</title>
<meta name="theme-color" content="#0b1418">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%201024%201024'%3E%3Cpath%20d='M480%20480m-352%200a352%20352%200%201%200%20704%200%20352%20352%200%201%200-704%200Z'%20fill='%23F9B95A'/%3E%3Cpath%20d='M232%20816a40%2040%200%200%201%200-80h224a40%2040%200%200%201%200-80h-384a40%2040%200%200%201%200-80h880a40%2040%200%200%201%200%2080h-128a40%2040%200%200%201%200%2080h-96a40%2040%200%200%201%200%2080h160a40%2040%200%200%201%200%2080h-528a40%2040%200%200%201%200-80h-128z'%20fill='%23AEF4E4'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1418;
    font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC",system-ui,sans-serif;}
  #c{display:block;width:100%;height:100%;}
  #ui{position:fixed;inset:0;pointer-events:none;}
  #ui > *{pointer-events:auto;}
  #hint{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);
    color:rgba(255,255,255,.72);font-size:13px;letter-spacing:.14em;
    opacity:0;transition:opacity .8s ease;}
  #hint.on{opacity:1;}
  /* UP14 / AM-033：首屏品牌行（网页名，中英）。
     显隐**完全派生自 `#hint` 的 `.on`** —— `#brand` 自己从不被 toggle，
     所以 99-main.js（900ms 定时器 + 首次手势两处）与 85-fallback.js（:187）**一行都不用改**：
     「与『轻触水面』同起同落」是 CSS 恒等式，不是需要维护的约定。
     `pointer-events:none` 必须有 —— 它不属 `#ui` 子树，吃不到 `#ui > *` 那条规则，
     否则会替水面吃掉手势。 */
  #brand{position:absolute;left:50%;bottom:calc(8% + 30px);transform:translateX(-50%);
    display:flex;align-items:baseline;gap:.62em;white-space:nowrap;
    opacity:0;transition:opacity .8s ease;pointer-events:none;}
  #hint.on + #brand{opacity:1;}
  #brand .cn{font-size:13.5px;letter-spacing:.20em;color:rgba(255,255,255,.88);}
  #brand .dot{font-size:10px;color:rgba(255,255,255,.42);}
  #brand .en{font-size:11px;letter-spacing:.16em;color:rgba(255,255,255,.62);}
  /* WebGL 不可用时的静态兜底 —— 先写，别等出事再补 */
  #fallback{position:fixed;inset:0;display:none;
    background:linear-gradient(180deg,#8fb8c9 0%,#4a7d92 46%,#1d3b47 100%);}
  #fallback.on{display:block;}
</style>
</head>
<body>
<div id="fallback"></div>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="hint">轻触水面</div>
<div id="brand"><span class="cn">静湖微澜</span><span class="dot">·</span><span class="en">Serene Ripple Lake</span></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/three-post.min.js"></script>  <!-- AM-009：后处理类（主控构建，暴露 THREEPOST） -->
<script src="src/00-config.js"></script>
<script src="src/10-audio.js"></script>
<script src="src/20-time.js"></script>
<script src="src/30-scene.js"></script>
<script src="src/40-lakebed.js"></script>
<script src="src/50-ripple.js"></script>
<script src="src/60-water.js"></script>
<script src="src/65-post.js"></script>  <!-- AM-009：后期处理管线（bloom + OutputPass） -->
<script src="src/70-input.js"></script>
<script src="src/80-ui.js"></script>
<script src="src/85-fallback.js"></script>
<script src="src/90-debug.js"></script>
<script src="src/99-main.js"></script>
<script>
  // 启动：try/catch 兜底，失败就显示 #fallback，不要白屏
  try { SW.boot(); }
  catch (e) {
    console.error('[still_water] boot failed', e);
    document.getElementById('fallback').classList.add('on');
    document.getElementById('c').style.display = 'none';
  }
</script>
</body>
</html>
